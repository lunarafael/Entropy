<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entropy · Voting</title>
  <link rel="stylesheet" href="style.css">
  <script src="overlay.js" defer></script>
</head>
<body>
  <main id="poll" class="poll" hidden aria-label="Entropy voting">
    <header class="poll-header">
      <span class="title">ENTROPY <span class="title-divider">/</span> VOTING</span>
      <span id="timer" class="timer" hidden></span>
      <span id="total" class="total"></span>
    </header>
    <ol id="options" class="options"></ol>
    <footer id="hint" class="hint"></footer>
  </main>
  <aside id="status" class="status" hidden></aside>
</body>
</html>
